[project]
name = "snake-game"
version = "1.5.0"
description = "A polished arcade Snake game built with Pygame"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pygame>=2.6.0",
]

[project.scripts]
snake-game = "snake_game.cli:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["snake_game*"]

[tool.setuptools.package-data]
snake_game = ["assets/*.png"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
]

[tool.coverage.run]
branch = true
source = ["snake_game"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

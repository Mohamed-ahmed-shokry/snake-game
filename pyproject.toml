[project]
name = "snake-game"
version = "1.0.0"
description = "A polished arcade Snake game built with Pygame"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pygame>=2.6.0",
]

[project.scripts]
snake-game = "snake_game.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
]
